name: Release Build - Codeoid

# A `vX.Y.Z` tag publishes what main tested (docs/release-gate.md, tier 0):
#   1. the tag is well formed and its commit is on main;
#   2. every PR check runs again on that commit (pr-check.yml, reused), with the
#      release gate's artifact and upgrade checks among them;
#   3. the versions in the repository already ARE the tag's (bumped in a PR, as
#      RELEASING.md says): the workflow checks them, it never rewrites them;
#   4. the three packages publish, each only if new; the GitHub Release is
#      created from the CHANGELOG section.

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGEX_PATTERN: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

jobs:
  highflame-validate:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Release Tag
        id: validate_tag
        shell: bash
        run: |-
          if [[ "${GITHUB_REF_NAME}" =~ ${{ env.REGEX_PATTERN }} ]] ; then
            echo "Valid version format: ${GITHUB_REF_NAME}"
          else
            echo "Invalid version format: ${GITHUB_REF_NAME}"
            exit 1
          fi

      # A tag on a branch nobody reviewed publishes nothing: releases are cut
      # from main.
      - name: The tagged commit is on main
        shell: bash
        run: |-
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on main"
          else
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      # The bump lands in a PR before the tag (RELEASING.md). Checked before the
      # long checks run, so a tag pushed without it fails in seconds.
      - name: Versions in the repository are the tag's
        shell: bash
        run: |-
          PKG="$(node -p "require('./package.json').version")"
          if [ "v$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is $PKG, the tag is $GITHUB_REF_NAME. Bump with 'bun run version:set ${GITHUB_REF_NAME#v}' in a PR, merge it, then tag that commit (RELEASING.md)."
            exit 1
          fi

  # Everything a PR is checked with, on the tagged commit: lint, typecheck, the
  # unit suite, e2e, the web checks, the real-sandbox tests, and the release
  # gate's artifact and upgrade checks.
  checks:
    needs:
      - highflame-validate
    permissions:
      contents: 'read'
    uses: ./.github/workflows/pr-check.yml
    secrets: inherit

  highflame-release:
    needs:
      - highflame-validate
      - checks
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (bump .bun-version on purpose): `latest` changes under us.
          bun-version-file: .bun-version

      - name: Setup Node (npm publish + provenance)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # OIDC Trusted Publishing requires the npm CLI >= 11.5.1; node 22 ships
      # an older 10.x. No token after this — auth is the GitHub OIDC id-token.
      - name: Upgrade npm for Trusted Publishing
        shell: bash
        run: npm install -g npm@latest

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      # Every publishable package ships at the SAME version, and the tag is that
      # version: the three versions and the internal ranges, against the tag.
      - name: Verify workspace versions are in lockstep with the tag
        shell: bash
        run: bun run check:versions "$GITHUB_REF_NAME"

      - name: Build web UI
        shell: bash
        run: |-
          cd web
          bun install --frozen-lockfile
          bun run build

      # Dependency order: protocol, then core (its peer), then the CLI, each only
      # if that exact version isn't on npm yet, so a re-run is safe. Each package
      # needs its own npm Trusted Publisher (OIDC) configured at npmjs.com.
      - name: Publish @highflame/codeoid-protocol
        shell: bash
        run: scripts/publish-if-new.sh packages/protocol

      - name: Publish @highflame/codeoid-core
        shell: bash
        run: scripts/publish-if-new.sh packages/core

      - name: Publish @highflame/codeoid
        shell: bash
        run: scripts/publish-if-new.sh .

      - name: Create the GitHub Release from the CHANGELOG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          VERSION="${GITHUB_REF_NAME#v}"
          # The `## [X.Y.Z]` section, up to the next `## [`.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no [$VERSION] section; the release points at it instead"
            echo "See CHANGELOG.md." > release-notes.md
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving it"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
