name: PR Merge Check - Codeoid

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  daemon-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (bump .bun-version on purpose): `latest` changes under us.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Version lockstep
        run: bun run check:versions

      - name: Typecheck
        run: bun run typecheck

      - name: Test (coverage + junit)
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: daemon
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./junit.xml
          flags: daemon
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: bun run build

  # End-to-end suite (#429): a real daemon per test, the web UI in Chromium and
  # the CLI, against the scripted backend — no model, no credentials.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Playwright's runner is Node; pin it rather than take the image's.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web UI
        run: bun run build:web

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e
        env:
          CI: "1"

      - name: Upload report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  web-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (bump .bun-version on purpose): `latest` changes under us.
          bun-version-file: .bun-version

      # Web consumes @codeoid/core + @codeoid/protocol via file: deps. When
      # bun installs those as symlinks, module resolution runs from the REAL
      # paths (packages/*/src) and up-walks to the repo-root node_modules for
      # core's @codeoid/protocol peer — so the root workspace must be
      # installed too (the release workflow already does this before
      # build:web).
      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
