name: PR Merge Check - Codeoid

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: daemon
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: |-
           bun install --frozen-lockfile

      - name: Lint
        run: |-
          bun run lint

      - name: Typecheck
        shell: bash
        run: |-
          bun run typecheck

      - name: Test (coverage + junit)
        shell: bash
        run: |-
           bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: daemon
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./junit.xml
          flags: daemon
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        shell: bash
        run: |-
          bun run build

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Web consumes @codeoid/core + @codeoid/protocol via file: deps. When
      # bun installs those as symlinks, module resolution runs from the REAL
      # paths (packages/*/src) and up-walks to the repo-root node_modules for
      # core's @codeoid/protocol peer — so the root workspace must be
      # installed too (the release workflow already does this before
      # build:web).
      - name: Install workspace dependencies
        working-directory: .
        run: |-
          bun install --frozen-lockfile

      - name: Install dependencies
        run: |-
          bun install --frozen-lockfile

      - name: Lint
        run: |-
          bun run lint

      - name: Typecheck
        run: |-
          bun run typecheck

      - name: Test
        run: |- 
          bun run test

      - name: Build
        run: |-
          bun run build
